[project]
authors = [
    { name = "Chris Gregory", email = "christopher.b.gregory@gmail.com" },
]
dependencies = [
    "numpy>=2.3.1",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "rich>=14.0.0",
    "typer>=0.16.0",
]
description = "Dynamic survey generator"
keywords = ["adaptive", "survey", "decision", "tree", "dynamic"]
license = { file = "LICENSE.txt" }
name = "surv"
readme = "README.md"
requires-python = ">=3.12"
version = "0.2.0"

[tool.uv]
dev-dependencies = [
    "mypy>=1.16.1",
    "pytest>=8.4.1",
    "ruff>=0.12.3",
    "semver>=3.0.4",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.urls]
Repository = "https://github.com/gregorybchris/surv"

[project.scripts]
surv = "surv.cli:app"

[tool.mypy]
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
ignore = ["D100", "D104", "FIX002", "TD002", "TD003"]
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "D",
    "E",
    "EM",
    "ERA",
    "F",
    "FIX",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PL",
    "PT",
    "PTH",
    "PLR",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T20",
    "TCH",
    "TD",
    "TID",
    "W",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.extend-per-file-ignores]
"**/__init__.py" = ["D"]
"**/tests/**/*.py" = ["D", "SLF", "PLR2004", "PLR6301"]
"src/surv/cli.py" = ["T201", "T203"]
